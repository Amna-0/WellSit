<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WellSit — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="gate-loading login-page">
  <div class="login-topbar">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">🌙</button>
    <button id="langToggle" class="lang-toggle" type="button">
      <span id="langToggleText">العربية</span>
    </button>
  </div>

  <div class="card login-card">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧘</span>
      <h1 data-i18n="appTitle">WellSit</h1>
    </div>
    <p class="subtitle" data-i18n="loginSubtitle">
      Track your sitting posture in real time — sign in to get started.
    </p>

    <form id="signInForm" class="auth-form">
      <input type="text" id="signInIdentifier" data-i18n-placeholder="usernameOrEmailLabel" placeholder="Username or email" required autocomplete="username" />
      <input type="password" id="signInPassword" data-i18n-placeholder="passwordLabel" placeholder="Password" required minlength="6" autocomplete="current-password" />
      <div class="auth-actions">
        <button type="submit" id="signInBtn" class="btn btn-primary" data-i18n="signInBtn">Sign In</button>
      </div>
    </form>

    <form id="signUpForm" class="auth-form hidden">
      <input type="text" id="signUpUsername" data-i18n-placeholder="usernameLabel" placeholder="Username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" />
      <input type="email" id="signUpEmail" data-i18n-placeholder="emailLabel" placeholder="Email" required autocomplete="email" />
      <input type="password" id="signUpPassword" data-i18n-placeholder="passwordLabel" placeholder="Password" required minlength="6" autocomplete="new-password" />
      <input type="password" id="signUpConfirmPassword" data-i18n-placeholder="confirmPasswordLabel" placeholder="Confirm password" required minlength="6" autocomplete="new-password" />
      <div class="auth-actions">
        <button type="submit" id="signUpBtn" class="btn btn-primary" data-i18n="signUpBtn">Create Account</button>
      </div>
    </form>

    <p id="authError" class="auth-error hidden"></p>
    <p id="firebaseWarning" class="auth-warning hidden" data-i18n="firebaseNotConfigured">Cloud sync isn't set up yet — add your Firebase project config in js/firebase-config.js.</p>

    <button id="modeSwitchBtn" type="button" class="mode-switch" data-i18n="switchToSignUp">Don't have an account? Create one</button>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
