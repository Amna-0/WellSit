<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostureCare — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="gate-loading login-page">
  <div class="login-topbar">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">🌙</button>
    <button id="langToggle" class="lang-toggle" type="button">
      <span id="langToggleText">العربية</span>
    </button>
  </div>

  <div class="card login-card">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧘</span>
      <h1 data-i18n="appTitle">PostureCare</h1>
    </div>
    <p class="subtitle" data-i18n="loginSubtitle">
      Track your sitting posture in real time — sign in to get started.
    </p>

    <form id="authForm" class="auth-form">
      <input type="email" id="authEmail" data-i18n-placeholder="emailLabel" placeholder="Email" required />
      <input type="password" id="authPassword" data-i18n-placeholder="passwordLabel" placeholder="Password" required minlength="6" />
      <div class="auth-actions">
        <button type="submit" id="signInBtn" class="btn btn-primary" data-i18n="signInBtn">Sign In</button>
        <button type="button" id="signUpBtn" class="btn btn-secondary" data-i18n="signUpBtn">Create Account</button>
        <button type="button" id="googleSignInBtn" class="btn btn-secondary" data-i18n="signInGoogleBtn">Continue with Google</button>
      </div>
    </form>
    <p id="authError" class="auth-error hidden"></p>
    <p id="firebaseWarning" class="auth-warning hidden" data-i18n="firebaseNotConfigured">Cloud sync isn't set up yet — add your Firebase project config in js/firebase-config.js.</p>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
